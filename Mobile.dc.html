<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #000000; color: #F7F7FA;
      font-family: 'Space Grotesk', 'Trebuchet MS', system-ui, sans-serif; }
    a { color: #FF3D8A; text-decoration: none; } a:hover { color: #3BE37E; }
    .mono { font-family: 'IBM Plex Mono', 'DejaVu Sans Mono', ui-monospace, monospace; }
    .btn { cursor: pointer; border: none; font-family: inherit; }
    .rail { display: flex; gap: 14px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
    .rail::-webkit-scrollbar { display: none; }
    .scan { background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 5px); }
    .blip { animation: blip 1.6s ease-in-out infinite; }
    @keyframes blip { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  </style>
</helmet>

<div style="--a: {{accent}}; min-height: 100%; background: #000000; padding: 64px 0 0; display: flex; flex-direction: column;">

  <!-- header -->
  <div style="display: flex; align-items: center; gap: 14px; padding: 0 22px;">
    <h1 style="margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -.035em; line-height: 1.08;">Explore<br>Deeds</h1>
    <div style="flex-grow: 1;"></div>
    <div style="width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(140deg, #3A1228, #170A11); border: 2px solid {{accent}}; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linejoin="round"><path d="M4 11 12 5l8 6v9H4z"/><path d="M10 20v-5h4v5"/></svg>
    </div>
  </div>

  <!-- search -->
  <div style="margin: 22px 22px 0; display: flex; align-items: center; gap: 12px; height: 54px; padding: 0 18px; border-radius: 27px; border: 1px solid #26262C; background: #0C0C0F;">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#7C7C87" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
    <span style="font-size: 14.5px; color: #6A6A74;">Search city, ticker or sponsor</span>
    <span style="flex-grow: 1;"></span>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg>
  </div>

  <!-- tabs -->
  <div style="display: flex; gap: 8px; margin: 22px 22px 0;">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
      <button class="btn" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
    </sc-for>
  </div>

  <!-- section head -->
  <div style="display: flex; align-items: center; padding: 26px 22px 14px;">
    <span style="font-size: 19px; font-weight: 700; letter-spacing: -.02em;">{{sectionTitle}}</span>
    <span style="flex-grow: 1;"></span>
    <span style="display: flex; align-items: center; gap: 7px; font-size: 13.5px; color: {{accent}};">See all
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
    </span>
  </div>

  <!-- carousel -->
  <div class="rail" style="padding: 0 22px;">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="2">
      <div style="flex-shrink: 0; width: 296px; border-radius: 22px; overflow: hidden; background: #0C0C0F; border: 1px solid #1E1E24;">
        <div class="scan" style="height: 244px; position: relative; background: {{c.art}};">
          <button class="btn" onClick="{{c.watch}}" style="position: absolute; top: 14px; right: 14px; width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center;">
            <svg width="18" height="18" viewBox="0 0 24 24" stroke-width="1.9" stroke="{{c.heartStroke}}" fill="{{c.heartFill}}" stroke-linejoin="round"><path d="M12 20.2 4.4 12.9a4.7 4.7 0 0 1 6.6-6.7l1 .9 1-.9a4.7 4.7 0 1 1 6.6 6.7z"/></svg>
          </button>
          <svg viewBox="0 0 140 120" width="230" height="197" fill="none" style="position: absolute; bottom: 28px; left: 34px; opacity: .95;">
            <path d="M14 104V52l30-18 30 18v52z" stroke="{{c.line}}" stroke-width="2.2" stroke-linejoin="round"/>
            <path d="M74 104V44l26-15 26 15v60z" stroke="#F7F7FA" stroke-opacity=".55" stroke-width="2.2" stroke-linejoin="round"/>
            <path d="M26 104V86h12v18M50 104V86h12v18M86 104V84h12v20" stroke="#F7F7FA" stroke-opacity=".4" stroke-width="1.6"/>
            <path d="M4 104h132" stroke="#F7F7FA" stroke-opacity=".75" stroke-width="2.2"/>
          </svg>
          <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: linear-gradient(180deg, transparent, rgba(0,0,0,.88) 62%);"></div>
          <div style="position: absolute; left: 18px; right: 18px; bottom: 16px;">
            <div style="display: flex; align-items: flex-end;">
              <div>
                <div style="font-size: 17px; font-weight: 700; letter-spacing: -.015em;">{{c.name}}</div>
                <div class="mono" style="font-size: 11px; color: #A6A6B0; margin-top: 4px; letter-spacing: .08em;">{{c.city}}</div>
              </div>
              <div style="flex-grow: 1;"></div>
              <div style="text-align: right;">
                <div class="mono" style="font-size: 10px; letter-spacing: .12em; color: #8A8A93;">CLOSES IN</div>
                <div class="mono blip" style="font-size: 13px; color: {{accent}}; margin-top: 3px;">{{c.ends}}</div>
              </div>
            </div>
          </div>
        </div>
        <div style="display: flex; align-items: center; padding: 15px 18px 17px;">
          <div>
            <div class="mono" style="font-size: 10px; letter-spacing: .12em; color: #6A6A74;">PRICE / TOKEN</div>
            <div class="mono" style="font-size: 18px; margin-top: 4px;">{{c.price}}</div>
          </div>
          <div style="flex-grow: 1;"></div>
          <button class="btn" style="display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 20px; border-radius: 23px; background: #FFC46B; color: #140F06; font-size: 14px; font-weight: 700;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#140F06" stroke-width="2" stroke-linejoin="round"><path d="M4 6h15l-1.6 8H7.2z"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>
            Buy
          </button>
        </div>
      </div>
    </sc-for>
  </div>

  <!-- top sponsors -->
  <div style="display: flex; align-items: center; padding: 28px 22px 14px;">
    <span style="font-size: 19px; font-weight: 700; letter-spacing: -.02em;">Top sponsors</span>
    <span style="flex-grow: 1;"></span>
    <span class="mono" style="font-size: 15px; color: #6A6A74; letter-spacing: .2em;">•••</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 16px; padding: 0 22px 26px;">
    <sc-for list="{{sponsors}}" as="s" hint-placeholder-count="2">
      <div style="display: flex; align-items: center; gap: 14px;">
        <div style="width: 46px; height: 46px; border-radius: 14px; background: {{s.art}}; border: 1px solid #26262C;"></div>
        <div>
          <div style="font-size: 15px; font-weight: 500;">{{s.name}}</div>
          <div class="mono" style="font-size: 11.5px; color: #7C7C87; margin-top: 3px;">{{s.meta}}</div>
        </div>
        <div style="flex-grow: 1;"></div>
        <button class="btn mono" onClick="{{s.follow}}" style="{{s.style}}">{{s.cta}}</button>
      </div>
    </sc-for>
  </div>

  <div style="flex-grow: 1;"></div>

  <!-- bottom nav -->
  <div style="display: flex; justify-content: space-around; align-items: center; height: 78px; border-top: 1px solid #1A1A1F; background: #08080A;">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
      <button class="btn" onClick="{{n.pick}}" style="background: transparent; width: 56px; height: 56px; border-radius: 18px; display: flex; align-items: center; justify-content: center; background-color: {{n.bg}};">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="{{n.ink}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.icon}}"/></svg>
      </button>
    </sc-for>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{
  "accent": {"editor": "color", "default": "#FF3D8A", "options": ["#FF3D8A", "#7C5CFF", "#3BE37E", "#00D3FF"], "section": "Theme"},
  "$preview": {"width": 390, "height": 900}
}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'closing', nav: 'home', liked: { WHSE: true }, following: {} };
  }

  renderVals() {
    const accent = this.props.accent ?? '#FF3D8A';

    const tabs = [
      { id: 'closing', label: 'Closing soon', title: 'Closing soon' },
      { id: 'yield', label: 'Top yield', title: 'Highest net yield' },
      { id: 'new', label: 'Just listed', title: 'Just listed' }
    ].map((t) => {
      const on = t.id === this.state.tab;
      return {
        ...t,
        pick: () => this.setState({ tab: t.id }),
        style: 'height: 40px; padding: 0 18px; border-radius: 20px; font-size: 13.5px; font-family: inherit;'
          + (on
            ? ' background: ' + accent + '; color: #0A0A0C; font-weight: 600;'
            : ' background: #101013; color: #8A8A93;')
      };
    });

    const cards = [
      { id: 'WHSE', name: 'Ridgeline Park', city: 'AUSTIN, TX · 9.2% YIELD', price: '$18.40', ends: '1h 26m 32s',
        line: accent, art: 'linear-gradient(165deg, #2E1020 0%, #150A10 58%, #050507 100%)' },
      { id: 'RETL', name: 'Roma Norte', city: 'MEXICO CITY · 11.7% YIELD', price: '$9.85', ends: '6h 04m 11s',
        line: '#3BE37E', art: 'linear-gradient(165deg, #0F2A1C 0%, #0A1710 58%, #050507 100%)' }
    ].map((c) => {
      const on = !!this.state.liked[c.id];
      return {
        ...c,
        watch: () => this.setState({ liked: { ...this.state.liked, [c.id]: !on } }),
        heartFill: on ? accent : 'none',
        heartStroke: on ? accent : '#C6C6CE'
      };
    });

    const sponsors = [
      { id: 'ridge', name: 'Ridgeline RE', meta: '14 deeds · $84M tokenized', art: 'linear-gradient(140deg,#3A1228,#170A11)' },
      { id: 'atlas', name: 'Atlas Iberia', meta: '9 deeds · $51M tokenized', art: 'linear-gradient(140deg,#1C2B4D,#0D1424)' },
      { id: 'verde', name: 'Casa Verde', meta: '6 deeds · $23M tokenized', art: 'linear-gradient(140deg,#12402A,#0A1D14)' }
    ].map((s) => {
      const on = !!this.state.following[s.id];
      return {
        ...s,
        follow: () => this.setState({ following: { ...this.state.following, [s.id]: !on } }),
        cta: on ? 'Following' : 'Follow',
        style: 'height: 38px; padding: 0 18px; border-radius: 19px; font-size: 12.5px; letter-spacing: .04em;'
          + (on
            ? ' background: #101013; border: 1px solid #2C2C33; color: #8A8A93;'
            : ' background: #7C5CFF; border: 1px solid #7C5CFF; color: #FFFFFF; font-weight: 600;')
      };
    });

    const nav = [
      { id: 'home', icon: 'M4 11 12 5l8 6v9H4zM10 20v-5h4v5' },
      { id: 'market', icon: 'M3 8h18l-1.5 12h-15zM8 8V6a4 4 0 0 1 8 0v2' },
      { id: 'vault', icon: 'M5 4h14v16l-7-3.5L5 20z' },
      { id: 'me', icon: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM5 20c1.4-3.2 4-4.8 7-4.8s5.6 1.6 7 4.8' }
    ].map((n) => {
      const on = n.id === this.state.nav;
      return {
        ...n,
        pick: () => this.setState({ nav: n.id }),
        ink: on ? '#0A0A0C' : '#6A6A74',
        bg: on ? accent : 'transparent'
      };
    });

    return {
      accent, tabs, cards, sponsors, nav,
      sectionTitle: tabs.find((t) => t.id === this.state.tab).title
    };
  }
}
</script>
</body>
</html>
